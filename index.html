<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão</title>
    <link rel="stylesheet" href="styles/login.css">
</head>

<body>
    <div class="login-container">
        <!-- Logo Adicionada -->
        <div class="logo-container">
            <img src="images/logo_login.png" alt="Logo da Empresa" class="logo">
        </div>

        <div class="login-box">
            <div class="login-header">
                <h1>Sistema de Escala</h1>
                <p>Faça login para acessar o sistema</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" required placeholder="Digite seu usuário"
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required placeholder="Digite sua senha"
                        autocomplete="current-password">
                </div>

                <button type="submit" class="login-btn">Entrar</button>
            </form>

            <div id="login-message" class="message"></div>

            <div class="login-footer">
                <p>Sistema de Escala. Todos os direitos reservados.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loginForm = document.getElementById('login-form');
            const messageDiv = document.getElementById('login-message');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            // Limpar campos
            usernameInput.value = '';
            passwordInput.value = '';

            // Verificar se já está logado
            async function checkIfLoggedIn() {
                try {
                    const user = await checkAuth();
                    if (user) {
                        window.location.href = 'central-sistemas.html';
                    }
                } catch (error) {
                    console.log('Usuário não logado:', error);
                }
            }

            checkIfLoggedIn();

            if (loginForm) {
                loginForm.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    const username = usernameInput.value.trim();
                    const password = passwordInput.value;
                    const loginBtn = this.querySelector('button[type="submit"]');

                    if (!username || !password) {
                        showMessage('Por favor, preencha todos os campos', 'error');
                        return;
                    }

                    loginBtn.classList.add('loading');
                    loginBtn.textContent = 'Entrando...';
                    hideMessage();

                    try {
                        // Usar função de login com fallback
                        const user = await customLogin(username, password);
                        showMessage(`Bem-vindo, ${user.username}!`, 'success');

                        // Redirecionar após login bem-sucedido
                        setTimeout(() => {
                            window.location.href = 'central-sistemas.html';
                        }, 1000);

                    } catch (error) {
                        showMessage(error.message || 'Erro ao fazer login', 'error');
                        console.error('Erro no login:', error);
                    } finally {
                        loginBtn.classList.remove('loading');
                        loginBtn.textContent = 'Entrar';
                    }
                });
            }

            function showMessage(message, type) {
                if (messageDiv) {
                    messageDiv.textContent = message;
                    messageDiv.className = `message ${type}`;
                    messageDiv.style.display = 'block';

                    // Não auto-esconder mensagens de erro
                    if (type !== 'error') {
                        setTimeout(() => {
                            if (messageDiv.textContent === message) {
                                messageDiv.style.display = 'none';
                            }
                        }, 3000);
                    }
                }
            }

            function hideMessage() {
                if (messageDiv) {
                    messageDiv.style.display = 'none';
                }
            }

            // Focar no campo de usuário ao carregar
            setTimeout(() => {
                usernameInput.focus();
            }, 100);
        });

        // Função para logout
        window.handleLogout = async function () {
            try {
                await customLogout();
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Erro ao fazer logout:', error);
            }
        };
    </script>
</body>

</html>
